<!--
  ⑨⑩ OG 태그 + 페이지 제목 + 설명 (정적 HTML용)
  아래를 <head> 안에 붙여넣고 CHANGE_ME 부분만 내 사이트에 맞게 바꾸세요.
  카톡·인스타 공유 미리보기, 구글 검색결과, 브라우저 탭이 한 번에 정돈됩니다.

  ⚠️ og:image는 반드시 "실제 존재하는" 이미지 주소여야 합니다. 권장 크기 1200×630.
     이미지가 없으면 공유해도 미리보기가 안 뜹니다.
-->

<!-- html 태그에 언어 명시 (검색·접근성) -->
<!-- <html lang="ko"> -->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 검색결과·탭에 뜨는 제목과 설명 -->
<title>내 사이트 이름 — 한 줄 소개</title>
<meta name="description" content="이 사이트가 무엇인지 한두 문장으로. 검색결과에 이 문장이 뜹니다." />
<link rel="canonical" href="https://CHANGE_ME.com/" />

<!-- 파비콘(탭 아이콘) -->
<link rel="icon" href="/favicon.ico" />

<!-- 오픈그래프 (카톡·페북·인스타 공유 미리보기) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="내 사이트 이름 — 한 줄 소개" />
<meta property="og:description" content="공유됐을 때 뜰 설명. 위 description과 같아도 됩니다." />
<meta property="og:image" content="https://CHANGE_ME.com/og-image.jpg" />
<meta property="og:url" content="https://CHANGE_ME.com/" />
<meta property="og:locale" content="ko_KR" />

<!-- 트위터/X 카드 -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="내 사이트 이름 — 한 줄 소개" />
<meta name="twitter:description" content="공유됐을 때 뜰 설명." />
<meta name="twitter:image" content="https://CHANGE_ME.com/og-image.jpg" />
